<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Contact</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
}

.contact {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}


.col {
  flex: 1;
  min-width: 800px;
}


table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

th {
  background: #f5f5f5;
  text-align: left;
}

tr:hover {
  background: #fafafa;
}


form {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

input, textarea {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  padding: 10px;
  border: none;
  background:brown;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background:brown;
}

iframe {
  width: 100%;
  height: 300px;
  border: 0;
  margin-top: 20px;
}

@media (max-width:768px) {
      .container {
        flex-direction: column;
      }

      body {
        padding: 15px;
      }

      table {
        font-size: 15px;
        height: 10%;
        width: 50%;
      }

      iframe {
        height: 50%;
        width: 60%;
      }
    }

</style>

</head>
<body>

<h1>Contact</h1>

<div class="contact">

  
  <div class="col">
    <h2>Adresse</h2>
    <p>
      34 Bis rue Bouchers,<br>
      59800 Lille<br>
      France
    </p>

      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1151.9581045110826!2d3.0569843811455275!3d50.637883385147695!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47c2d587391e5413%3A0x67976bc389832a8!2s34%20bis%20Rue%20des%20Bouchers%2C%2059800%20Lille!5e0!3m2!1sfr!2sfr!4v1778055753292!5m2!1sfr!2sfr"
       width="800" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

  
  <div class="col">
    <h2>Horaires d'ouverture</h2>

    <table>
      <tr>
        <th>Jour</th>
        <th>Horaires</th>
      </tr>
      <tr><td>Lundi</td><td>Fermé</td></tr>
      <tr><td>Mardi</td><td>09h - 18h</td></tr>
      <tr><td>Mercredi</td><td>Fermé</td></tr>
      <tr><td>Jeudi</td><td>09h - 18h</td></tr>
      <tr><td>Vendredi</td><td>09h - 17h</td></tr>
      <tr><td>Samedi</td><td>10h - 16h</td></tr>
      <tr><td>Dimanche</td><td>12h - 22h</td></tr>
    </table>
  </div>

</div>

<h2>Nous contacter</h2>

<form>
  <input type="text" name="nom" placeholder="Votre nom" required>
  
  <input type="email" name="email" placeholder="Votre email" required>
  
  <textarea name="message" placeholder="Votre message" rows="5" required></textarea>
  
  <button type="submit">Envoyer</button>
</form>

</body>
</html>
